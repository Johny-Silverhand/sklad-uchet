name: Release v1.2.3

on:
  push:
    paths:
      - ".github/workflows/release-v1.2.3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Build Windows Setup.exe
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w -H windowsgui" -o SkladUchet-Setup.exe .
          ls -lh SkladUchet-Setup.exe

      - name: Publish release v1.2.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3
          name: "Склад Учёт v1.2.3"
          body_path: RELEASE_NOTES_v1.2.3.md
          files: SkladUchet-Setup.exe
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
